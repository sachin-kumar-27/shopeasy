<!DOCTYPE html>
<html>
<head>
<title>ShopEasy - E-Commerce</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
header{background:#232f3e;color:white;padding:15px;text-align:center}
.products{display:flex;gap:20px;padding:20px;flex-wrap:wrap}
.card{background:white;padding:15px;border-radius:8px;width:200px;box-shadow:0 2px 5px #ccc}
button{background:#ff9900;border:none;padding:8px 15px;border-radius:4px;cursor:pointer}
</style>
</head>
<body>
<header><h1>🛒 ShopEasy - Full Stack Store</h1><p>React | Node.js | SQL | Gen AI</p></header>
<div class="products">
<div class="card"><h3>iPhone 15</h3><p>₹79,999</p><button>Add to Cart</button></div>
<div class="card"><h3>MacBook Air</h3><p>₹99,999</p><button>Add to Cart</button></div>
<div class="card"><h3>Nike Shoes</h3><p>₹5,999</p><button>Add to Cart</button></div>
</div>
</body>
</html>
