<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEasy - Full Stack Store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f1f5f9}
.header{background:#0f172a;color:white;padding:20px;text-align:center}
.header p{color:#94a3b8;margin-top:5px;font-size:14px}
.cart-bar{background:white;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 5px rgba(0,0,0,0.1);position:sticky;top:0;z-index:10}
#cart-count{background:#f97316;color:white;padding:4px 10px;border-radius:20px;font-weight:bold}
.container{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:20px;max-width:1000px;margin:auto}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.card h3{margin-bottom:8px}
.price{color:#16a34a;font-weight:bold;margin:10px 0}
.btn{background:#f97316;color:white;border:none;padding:10px 16px;border-radius:6px;cursor:pointer;width:100%;font-weight:bold}
.btn:hover{background:#ea580c}
#cart-items{max-width:1000px;margin:0 auto;padding:0 20px 40px}
.cart-item{background:white;padding:12px;display:flex;justify-content:space-between;margin-bottom:8px;border-radius:8px}
</style>
</head>
<body>
<div class="header">
<h1>🛒 ShopEasy - Full Stack Store</h1>
<p>React | Node.js | SQL | Gen AI</p>
</div>

<div class="cart-bar">
<span>🛒 Cart: <span id="cart-count">0</span> items</span>
<span>Total: ₹<span id="total">0</span></span>
</div>

<div class="container">
<div class="card">
<h3>iPhone 15</h3>
<p>Latest Apple smartphone</p>
<div class="price">₹79,999</div>
<button class="btn" onclick="addToCart('iPhone 15',79999)">Add to Cart</button>
</div>
<div class="card">
<h3>MacBook Air</h3>
<p>Superfast M2 Chip</p>
<div class="price">₹99,999</div>
<button class="btn" onclick="addToCart('MacBook Air',99999)">Add to Cart</button>
</div>
<div class="card">
<h3>Nike Shoes</h3>
<p>Running shoes</p>
<div class="price">₹5,999</div>
<button class="btn" onclick="addToCart('Nike Shoes',5999)">Add to Cart</button>
</div>
</div>

<div id="cart-items"></div>

<script>
let cart=[];
let total=0;
function addToCart(name,price){
cart.push({name,price});
total+=price;
document.getElementById('cart-count').innerText=cart.length;
document.getElementById('total').innerText=total;
document.getElementById('cart-items').innerHTML=cart.map((item,i)=>`
<div class="cart-item"><span>${item.name} - ₹${item.price}</span> <button onclick="removeItem(${i})" style="color:red;border:none;background:none;cursor:pointer">Remove</button></div>
`).join('') + (cart.length? `<div style="text-align:center;margin-top:15px"><button onclick="checkout()" class="btn" style="width:auto">Checkout ₹${total}</button></div>` : '');
alert(name + ' added to cart!');
}
function removeItem(i){
total-=cart[i].price;
cart.splice(i,1);
document.getElementById('cart-count').innerText=cart.length;
document.getElementById('total').innerText=total;
document.getElementById('cart-items').innerHTML=cart.length? cart.map((item,index)=>`
<div class="cart-item"><span>${item.name} - ₹${item.price}</span> <button onclick="removeItem(${index})" style="color:red;border:none;background:none;cursor:pointer">Remove</button></div>
`).join('') + `<div style="text-align:center;margin-top:15px"><button onclick="checkout()" class="btn" style="width:auto">Checkout ₹${total}</button></div>` : '';
}
function checkout(){
alert('Order Placed! Total: ₹' + total + ' - Thank you for shopping with ShopEasy!');
cart=[];total=0;
document.getElementById('cart-count').innerText=0;
document.getElementById('total').innerText=0;
document.getElementById('cart-items').innerHTML='';
}
</script>
</body>
</html>
